[project]
name = "capital-programme-optimiser"
version = "0.1.0"
description = "Capital Programme Optimizer"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow>=14.0",
    "ortools",
    "openpyxl",
    "matplotlib",
    "plotly>=5.17",
    "PyYAML>=6.0",
    "requests>=2.32",
    "streamlit>=1.27",
    "streamlit-option-menu>=0.3.6",
    "XlsxWriter>=3.1",
    "mlflow",
    "ruff>=0.14.9",
]

[tool.ruff]
# Exclude legacy directory from linting
exclude = ["legacy", "notebooks", "*.ipynb"]

# Same line length as previously used in flake8
line-length = 127

[tool.ruff.lint]
# Select rules to match common flake8 defaults + ruff recommendations
# E: pycodestyle
# F: Pyflakes
# I: isort
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"src/main.py" = ["E402"]
